name: beacon_bridge
description: >-
  Desktop companion CLI for the beacon Flutter package. Attaches to your
  running flutter run, saves each tapped widget's reference and screenshot,
  and copies a paste-ready line to your clipboard.
version: 0.1.0
repository: https://github.com/moghoneim-code/beacon_bridge
issue_tracker: https://github.com/moghoneim-code/beacon_bridge/issues
topics:
  - devtools
  - debugging
  - developer-tools
  - cli

environment:
  sdk: ^3.10.8

# Add regular dependencies here.
dependencies:
  meta: ^1.19.0
  path: ^1.9.0
  vm_service: ^15.2.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
